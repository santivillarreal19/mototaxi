# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Cada 3 días se hace una consulta liviana (con la clave anon RLS devuelve [], pero toca la base).
# Ojo: GitHub desactiva los cron de repos sin commits en 60 días; ver README → Operación.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 13 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/motos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
